al Customer 004</td><td>3,756.35</td></tr></table>", "note": "Actual Cortex Analyst result through DAILY_SALES_SEMANTIC. Account-review shortlist, not permission to contact customers."}, {"title": "Measured checks. Honest limits.", "body": "<div class=\"cards\"><div><b>19 / 19</b><br>Historical custom agent suite</div><div><b>2 / 2</b><br>Build tests after version fix</div><div><b>4 answers</b><br>Native correctness: 1.00</div></div><p>One native Builder consistency score: 0.67.<br>Learning: retrieve full definitions before citing.<br>No consent, margin, campaign uplift or production savings claimed.</p>", "note": "Small synthetic suites. Whole-document retrieval; no chunking comparison. Single workshop role. Native connectors are future work."}];let n=Math.max(0,Math.min(5,Number(new URLSearchParams(location.search).get('scene'))||0));function draw(){document.getElementById('title').textContent=scenes[n].title;document.getElementById('body').innerHTML=scenes[n].body;document.getElementById('note').textContent=scenes[n].note;}function go(d){n=(n+d+6)%6;draw()}document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});draw();</script>
